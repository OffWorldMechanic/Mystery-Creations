<!DOCTYPE html>
<html lang="en" data-page-title="Thank you — {name}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1016">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <title>Thank you — Mystery Creations</title>
  <meta name="description" content="Your Mystery Creations order is in.">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,450&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script>
    (function () {
      var n = (window.STORE_CONFIG && STORE_CONFIG.name) || "Mystery Creations";
      document.title = "Thank you — " + n;
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="index.html">
        <img class="monogram" src="img/monogram.svg" width="38" height="38" alt="">
        <span class="wordmark-text">
          <strong data-store-name>Mystery Creations</strong>
          <span class="wordmark-sub">Themed mystery boxes</span>
        </span>
      </a>
      <div class="header-cta header-cta-mobile">
        <a class="btn btn-ghost" href="index.html">Back to the store</a>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="success-card">
        <p class="eyebrow" style="justify-content:center">Order received</p>
        <h1>Thank you</h1>
        <p>Your mystery box is on our list. A receipt will come from Stripe, and we’ll email tracking once your box has shipped. If anything looks off, write us at <a data-store-email href="mailto:help@mymysterycreations.com">help@mymysterycreations.com</a>.</p>
        <p style="margin-top:28px"><a class="btn btn-gold" href="index.html">Return home</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="disclaimer" data-disclaimer></p>
    </div>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
